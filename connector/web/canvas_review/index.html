<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessible Documents — Reflow</title>
<style>
  /* ------------------------------------------------------------------
     Tokens. Everything visual resolves through these, so an institution
     can retheme the connector by overriding one block rather than
     hunting hex codes through the stylesheet.

     Contrast is checked against the surface it actually sits on, not
     against white, and every pair below clears WCAG 2.2 AA (4.5:1 for
     body text, 3:1 for UI boundaries). This is an accessibility tool;
     the tool itself has to pass.
     ------------------------------------------------------------------ */
  :root {
    --bg:          #f7f8fa;
    --surface:     #ffffff;
    --surface-alt: #fbfcfd;
    --border:      #e4e7ec;
    --border-firm: #d0d5dd;
    --text:        #101828;   /* 17.8:1 on surface */
    --muted:       #667085;   /*  5.3:1 on surface */
    --accent:      #4338ca;   /*  8.0:1 on surface */
    --accent-fg:   #ffffff;
    --accent-soft: #eef2ff;
    --ring:        #4338ca;

    --ok-bg:   #ecfdf3;  --ok-fg:   #027a48;  /* 5.9:1 */
    --work-bg: #f2f4f7;  --work-fg: #344054;  /* 9.4:1 */
    --need-bg: #eff8ff;  --need-fg: #175cd3;  /* 6.1:1 */
    --warn-bg: #fef3f2;  --warn-fg: #b42318;  /* 6.6:1 */

    --radius: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lift: 0 4px 8px -2px rgba(16,24,40,.10), 0 2px 4px -2px rgba(16,24,40,.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #0b0e14;
      --surface:     #131720;
      --surface-alt: #171c26;
      --border:      #232a36;
      --border-firm: #313a49;
      --text:        #e6e9ef;   /* 14.1:1 */
      --muted:       #98a2b3;   /*  6.2:1 */
      --accent:      #a5b4fc;   /*  8.4:1 */
      --accent-fg:   #0b0e14;
      --accent-soft: #1c2130;
      --ring:        #a5b4fc;

      --ok-bg:   #0f2a1d;  --ok-fg:   #6ce9a6;
      --work-bg: #1c222d;  --work-fg: #cdd5df;
      --need-bg: #10243d;  --need-fg: #84caff;
      --warn-bg: #2d1516;  --warn-fg: #fda29b;
      --shadow: none;
      --shadow-lift: none;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 68rem; margin: 0 auto; }

  header.page { margin-bottom: 1.75rem; }
  h1 { font-size: 1.55rem; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 0.3rem; }
  p.lede { color: var(--muted); margin: 0; max-width: 46rem; }

  /* ---- Summary tiles double as filters -----------------------------
     One control, not two. A count you cannot act on is decoration, and
     a filter with no count makes you click to find out if it is empty. */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
           gap: 0.75rem; margin: 1.5rem 0 1.25rem; }
  .tile { text-align: left; font: inherit; cursor: pointer;
          background: var(--surface); color: var(--text);
          border: 1px solid var(--border); border-radius: var(--radius);
          padding: 0.85rem 1rem; box-shadow: var(--shadow);
          transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease; }
  .tile:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
  .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .tile:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .tile .n { display: block; font-size: 1.6rem; font-weight: 650; letter-spacing: -0.02em; }
  .tile .k { display: block; font-size: 0.82rem; color: var(--muted); font-weight: 500; }

  /* ---- Toolbar ----------------------------------------------------- */
  .toolbar { display: flex; gap: 0.75rem; align-items: center;
             flex-wrap: wrap; margin-bottom: 0.9rem; }
  .search { position: relative; flex: 1 1 18rem; }
  .search input { width: 100%; font: inherit; color: var(--text);
                  background: var(--surface); border: 1px solid var(--border-firm);
                  border-radius: 8px; padding: 0.55rem 0.75rem 0.55rem 2.1rem; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px;
                                border-color: var(--accent); }
  .search svg { position: absolute; left: 0.65rem; top: 50%; transform: translateY(-50%);
                width: 1rem; height: 1rem; color: var(--muted); pointer-events: none; }
  .live { color: var(--muted); font-size: 0.88rem; margin-left: auto; }

  /* ---- Table ------------------------------------------------------- */
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  caption { text-align: left; padding: 0; }
  thead th { position: sticky; top: 0; z-index: 1;
             background: var(--surface-alt); color: var(--muted);
             font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
             letter-spacing: 0.04em; text-align: left;
             padding: 0.65rem 1rem; border-bottom: 1px solid var(--border); }
  tbody td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border);
             vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-alt); }
  td.name { font-weight: 550; word-break: break-word; max-width: 26rem; }
  td.when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.act { text-align: right; white-space: nowrap; }

  /* ---- Status pills ------------------------------------------------
     Colour is never the only carrier: each pill states its condition in
     words and shows a shape-distinct dot, so the table survives
     greyscale printing and colour vision deficiency (SC 1.4.1). */
  .pill { display: inline-flex; align-items: center; gap: 0.4rem;
          padding: 0.2rem 0.6rem; border-radius: 999px;
          font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .pill .dot { width: 0.45rem; height: 0.45rem; border-radius: 50%;
               background: currentColor; flex: none; }
  .pill-done   { background: var(--ok-bg);   color: var(--ok-fg); }
  .pill-work   { background: var(--work-bg); color: var(--work-fg); }
  .pill-need   { background: var(--need-bg); color: var(--need-fg); }
  .pill-warn   { background: var(--warn-bg); color: var(--warn-fg); }
  .pill-work .dot { border-radius: 2px; }          /* square = in flight */
  .pill-warn .dot { border-radius: 1px; transform: rotate(45deg); }  /* diamond = problem */
  .reason { display: block; margin-top: 0.35rem; font-size: 0.84rem;
            color: var(--muted); max-width: 30rem; }

  /* ---- Buttons ----------------------------------------------------- */
  .btn { display: inline-block; font: inherit; font-size: 0.88rem; font-weight: 550;
         padding: 0.45rem 0.9rem; border-radius: 8px; text-decoration: none;
         border: 1px solid transparent; cursor: pointer; min-height: 36px; }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border-firm); }
  .btn-ghost:hover { background: var(--surface-alt); }
  .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .dash { color: var(--muted); }

  /* ---- Skeleton + empty -------------------------------------------- */
  .sk { height: 0.85rem; border-radius: 4px; background: var(--work-bg); }
  .sk-wide { width: 60%; } .sk-mid { width: 40%; } .sk-thin { width: 25%; }
  @media (prefers-reduced-motion: no-preference) {
    .sk { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  }
  .empty { padding: 3rem 1rem; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 0.3rem; }

  /* ---- Opt-in card -------------------------------------------------- */
  .optin { margin-top: 1.5rem; background: var(--surface); border: 1px solid var(--border);
           border-radius: var(--radius); padding: 1.1rem 1.25rem; box-shadow: var(--shadow); }
  .optin h2 { font-size: 0.98rem; margin: 0 0 0.3rem; }
  .optin p { margin: 0.3rem 0; }
  .optin .muted { color: var(--muted); font-size: 0.88rem; max-width: 46rem; }
  .optin button { margin-top: 0.6rem; font: inherit; font-size: 0.88rem; font-weight: 550;
                  padding: 0.45rem 0.9rem; border-radius: 8px; cursor: pointer;
                  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
  .optin button[aria-pressed="true"] { background: var(--surface); color: var(--text);
                                       border-color: var(--border-firm); }
  .optin button:disabled { opacity: .55; cursor: not-allowed; }
  .optin button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .state-on  { font-weight: 650; color: var(--ok-fg); }
  .state-off { font-weight: 650; color: var(--warn-fg); }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
             overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* ---- Narrow viewports -------------------------------------------
     Below 720px the table collapses into stacked cards. A four-column
     grid on a phone forces horizontal scrolling, which is a 1.4.10
     reflow failure, and faculty do open this on tablets. */
  @media (max-width: 720px) {
    .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
    thead { display: none; }
    tbody tr { display: block; padding: 0.9rem 1rem; border-bottom: 1px solid var(--border); }
    tbody td { display: block; border: 0; padding: 0.15rem 0; }
    td.name { max-width: none; font-size: 1rem; }
    td.act { text-align: left; margin-top: 0.6rem; }
    td.when::before { content: "Updated "; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>Accessible Documents</h1>
    <p class="lede">Hello, {{ user_name }}. Every PDF Reflow knows about in this course, and where it stands. Anything waiting on your decision is listed first.</p>
  </header>

  <div class="tiles" id="tiles" role="group" aria-label="Filter documents by state" hidden>
    <button type="button" class="tile" data-filter="needs_you"  aria-pressed="false"><span class="n" data-count="needs_you">0</span><span class="k">Needs you</span></button>
    <button type="button" class="tile" data-filter="attention"  aria-pressed="false"><span class="n" data-count="attention">0</span><span class="k">Needs attention</span></button>
    <button type="button" class="tile" data-filter="converting" aria-pressed="false"><span class="n" data-count="converting">0</span><span class="k">Converting</span></button>
    <button type="button" class="tile" data-filter="done"       aria-pressed="false"><span class="n" data-count="done">0</span><span class="k">Published</span></button>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="9" cy="9" r="6"></circle><path d="M13.5 13.5 17 17"></path>
      </svg>
      <label class="sr-only" for="q">Search documents by filename</label>
      <input id="q" type="search" placeholder="Search documents…" autocomplete="off">
    </div>
    <p class="live" id="status" aria-live="polite"></p>
  </div>

  <div class="card">
    <table id="queue">
      <caption class="sr-only">Documents in this course and their conversion state</caption>
      <thead>
        <tr>
          <th scope="col">Document</th>
          <th scope="col">State</th>
          <th scope="col">Updated</th>
          <th scope="col"><span class="sr-only">Action</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </div>

  <section class="optin" id="optin" hidden aria-labelledby="optin-h">
    <h2 id="optin-h">Automatic conversion for this course</h2>
    <p id="optin-state" aria-live="polite"></p>
    <p class="muted" id="optin-help"></p>
    <p><button type="button" id="optin-btn" aria-pressed="false" disabled>Loading…</button></p>
  </section>
</div>

<script>
  const courseId = "{{ course_id }}";
  const tbody    = document.getElementById("rows");
  const table    = document.getElementById("queue");
  const empty    = document.getElementById("empty");
  const statusEl = document.getElementById("status");
  const tiles    = document.getElementById("tiles");
  const search   = document.getElementById("q");

  // Each state gets a word as well as a colour and a dot shape. The PII
  // gate blocks Reflow before it produces anything; the accessibility
  // gate is the last step before students see the page. Both need you.
  const LABELS = {
    awaiting_approval: ["Privacy review",  "pill-need"],
    awaiting_review:   ["Ready to review", "pill-need"],
    published:         ["Published",       "pill-done"],
    processing:        ["Converting",      "pill-work"],
    processing_queued: ["Queued",          "pill-work"],
    queued:            ["Queued",          "pill-work"],
    pii_scanning:      ["Checking for personal data", "pill-work"],
    page_failed:       ["Page blocked",    "pill-warn"],
    failed:            ["Did not convert", "pill-warn"],
    rejected:          ["Declined",        "pill-warn"],
    denied:            ["Privacy denied",  "pill-warn"],
  };

  // Exact timestamps are unreadable at a glance and relative ones are
  // ambiguous in a record, so show relative and keep the exact value in
  // the title for anyone who needs to cite it.
  function relTime(secs) {
    if (!secs) return { rel: "—", abs: "" };
    const d = new Date(secs * 1000);
    const mins = Math.round((Date.now() - d.getTime()) / 60000);
    let rel;
    if (mins < 1)        rel = "just now";
    else if (mins < 60)  rel = `${mins} min ago`;
    else if (mins < 1440) { const h = Math.round(mins / 60); rel = `${h} hour${h === 1 ? "" : "s"} ago`; }
    else { const dd = Math.round(mins / 1440); rel = `${dd} day${dd === 1 ? "" : "s"} ago`; }
    return { rel, abs: d.toLocaleString() };
  }

  function pillFor(row) {
    const [label, cls] = LABELS[row.status] || ["Working", "pill-work"];
    let html = `<span class="pill ${cls}"><span class="dot" aria-hidden="true"></span>${escapeHtml(label)}</span>`;
    if (row.reason) html += `<span class="reason">${escapeHtml(row.reason)}</span>`;
    return html;
  }

  // Only rows that can be acted on get a control, so nothing looks
  // clickable that isn't.
  function actionCell(row) {
    if (row.action_url) {
      return `<a class="btn btn-primary" href="${escapeHtml(row.action_url)}">Review<span class="sr-only"> ${escapeHtml(row.filename)}</span></a>`;
    }
    if (row.status === "published" && row.canvas_page_url) {
      return `<a class="btn btn-ghost" href="${escapeHtml(row.canvas_page_url)}">View page<span class="sr-only"> for ${escapeHtml(row.filename)}</span></a>`;
    }
    return '<span class="dash" aria-hidden="true">—</span>';
  }

  let allRows = [];
  let activeFilter = "all";
  let query = "";

  function visibleRows() {
    return allRows.filter(r => {
      if (activeFilter !== "all" && r.bucket !== activeFilter) return false;
      if (query && !r.filename.toLowerCase().includes(query)) return false;
      return true;
    });
  }

  function showEmpty(title, detail) {
    table.hidden = true;
    empty.hidden = false;
    empty.innerHTML = `<strong>${escapeHtml(title)}</strong>${escapeHtml(detail)}`;
  }

  function paintRows() {
    const rows = visibleRows();
    tbody.innerHTML = "";
    if (!rows.length) {
      if (!allRows.length) {
        showEmpty("Nothing here yet",
          "Turn on automatic conversion below, or copy a PDF into the drop folder in Course Files.");
      } else if (query) {
        showEmpty("No matches", `Nothing matches “${query}”.`);
      } else {
        showEmpty("Nothing in this state", "Try another filter.");
      }
      return;
    }
    table.hidden = false;
    empty.hidden = true;
    const frag = document.createDocumentFragment();
    for (const row of rows) {
      const t = relTime(row.created_at);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="name">${escapeHtml(row.filename)}</td>
        <td>${pillFor(row)}</td>
        <td class="when"><time title="${escapeHtml(t.abs)}">${escapeHtml(t.rel)}</time></td>
        <td class="act">${actionCell(row)}</td>
      `;
      frag.appendChild(tr);
    }
    tbody.appendChild(frag);
  }

  function paintSkeleton() {
    table.hidden = false;
    empty.hidden = true;
    tbody.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><div class="sk sk-wide"></div></td><td><div class="sk sk-thin"></div></td>
                      <td><div class="sk sk-thin"></div></td><td><div class="sk sk-mid"></div></td>`;
      tbody.appendChild(tr);
    }
  }

  tiles.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-filter]");
    if (!btn) return;
    // Clicking the active tile clears it — a filter you cannot switch off
    // is a trap when the list is long.
    const next = btn.dataset.filter;
    activeFilter = (activeFilter === next) ? "all" : next;
    for (const b of tiles.querySelectorAll("button[data-filter]")) {
      b.setAttribute("aria-pressed", b.dataset.filter === activeFilter ? "true" : "false");
    }
    paintRows();
  });

  search.addEventListener("input", () => {
    query = search.value.trim().toLowerCase();
    paintRows();
  });

  async function load() {
    if (!allRows.length) paintSkeleton();
    try {
      const resp = await fetch(`/canvas/review/api/files?course_id=${encodeURIComponent(courseId)}`,
                               { credentials: "same-origin" });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      allRows = data.files || [];
      const counts = data.counts || {};
      tiles.hidden = allRows.length === 0;
      for (const el of tiles.querySelectorAll("[data-count]")) {
        el.textContent = counts[el.dataset.count] || 0;
      }
      const needs = counts.needs_you || 0;
      statusEl.textContent = needs
        ? `${needs} document${needs === 1 ? "" : "s"} waiting on your decision`
        : (allRows.length ? "Nothing is waiting on you" : "");
      paintRows();
    } catch (err) {
      statusEl.textContent = "";
      showEmpty("Could not load documents", err.message);
    }
  }

  // Documents change state on their own, so a screen left open goes stale
  // within a minute. Refresh quietly rather than making people reload.
  setInterval(load, 30000);

  // ---- Automatic conversion switch -----------------------------------
  // Reflow does nothing to a course until someone turns it on here. The
  // drop folder still works either way, which is how most people start.
  const optinBox   = document.getElementById("optin");
  const optinState = document.getElementById("optin-state");
  const optinHelp  = document.getElementById("optin-help");
  const optinBtn   = document.getElementById("optin-btn");

  function paintOptin(d) {
    if (!d.required) { optinBox.hidden = true; return; }   // operator forced always-on
    optinBox.hidden = false;
    const on = !!d.enabled;
    optinState.innerHTML = on
      ? 'Automatic conversion is <span class="state-on">ON</span> for this course.'
      : 'Automatic conversion is <span class="state-off">OFF</span> for this course.';
    let help = on
      ? "Reflow checks this course's files, modules, pages and assignments and converts new documents as they appear."
      : "Reflow is not scanning this course. Nothing is converted unless you put it in the drop folder.";
    if (d.drop_folder) {
      help += ' Either way, you can copy a single PDF into the "' + d.drop_folder +
              '" folder in Course Files to convert just that one.';
    }
    if (on && d.enabled_by) help += " Turned on by " + d.enabled_by + ".";
    optinHelp.textContent = help;

    optinBtn.setAttribute("aria-pressed", on ? "true" : "false");
    optinBtn.textContent = on ? "Turn off automatic conversion" : "Turn on automatic conversion";
    optinBtn.disabled = !d.can_change;
    if (!d.can_change) {
      optinHelp.textContent += " Only an instructor in this course can change this.";
    }
  }

  async function loadOptin() {
    try {
      const r = await fetch(`/canvas/review/api/optin?course_id=${encodeURIComponent(courseId)}`,
                            { credentials: "same-origin" });
      if (!r.ok) { optinBox.hidden = true; return; }
      paintOptin(await r.json());
    } catch (_) { optinBox.hidden = true; }
  }

  optinBtn.addEventListener("click", async () => {
    const turningOn = optinBtn.getAttribute("aria-pressed") !== "true";
    optinBtn.disabled = true;
    optinBtn.textContent = turningOn ? "Turning on…" : "Turning off…";
    try {
      const r = await fetch(`/canvas/review/api/optin?course_id=${encodeURIComponent(courseId)}`, {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: turningOn }),
      });
      if (!r.ok) {
        const msg = r.status === 403
          ? "Only an instructor in this course can change this."
          : "Could not change the setting. Please try again.";
        optinState.textContent = msg;
        optinBtn.disabled = false;
        return;
      }
      await loadOptin();
    } catch (_) {
      optinState.textContent = "Could not reach Reflow. Please try again.";
      optinBtn.disabled = false;
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  loadOptin();
  load();
</script>
</body>
</html>
