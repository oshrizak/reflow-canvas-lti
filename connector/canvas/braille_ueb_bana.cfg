# liblouisutdml configuration — English (UEB), BANA formatting.
#
# The open-source equivalent of Duxbury's "English (UEB) — BANA" template,
# which is what an alternate-media production manual typically specifies.
#
# Two tables, deliberately:
#
#   literaryTextTable   en-ueb-g2.ctb   contracted UEB for running prose
#   mathexprTable       nemeth.ctb      Nemeth for MathML expressions
#
# Keeping them separate is the point. A document containing one equation
# must not have its prose transcribed in a mathematical notation; Nemeth
# applies to the expressions and UEB to everything around them, per BANA's
# "Guidance for Transcription Using the Nemeth Code within UEB Contexts".
#
# Operators can override any of this with a site-local copy — the path is
# resolved in connector/canvas/braille.py. Cell and line counts are also
# overridable per call, since embossers vary.

literaryTextTable en-ueb-g2.ctb
mathexprTable nemeth.ctb
mathtextTable en-ueb-g2.ctb

# BANA standard page geometry.
cellsPerLine 40
linesPerPage 25

# Braille page numbers (bottom right) and print page numbers, so a reader
# can find the same page everyone else in the room is looking at.
braillePages yes
printPages yes
pageSeparator yes
pageSeparatorNumber yes

# Preserve the document's own structure rather than reflowing everything
# into undifferentiated paragraphs.
newLineAfterHeading yes
paragraphs yes
contents yes

# Emphasis carries poorly into braille and adds noise when it survives
# from HTML styling rather than from meaning.
emphasis no

formatFor brf
outputFormat brf
